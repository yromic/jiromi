# fly.toml app configuration file generated for jiromi on 2026-10-20T11:34:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jiromi'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  JIROMI_BACKUP_DIR = '/data/backups'
  JIROMI_DB_PATH = '/data/schema.db'
  JIROMI_LOG_DIR = '/data/logs'
  PORT = '8080'
  PYTHONUNBUFFERED = '1'

[[mounts]]
  source = 'jiromi_data'
  destination = '/data'
  processes = ['app']

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
